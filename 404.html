<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Zone Not Found | SvK</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #060611;
            --bg-card: rgba(15, 15, 34, 0.85);
            --color-accent: #00ffcc;
            --color-neon-pink: #ff3366;
            --text-primary: #ffffff;
            --text-secondary: #9499c3;
            --font-heading: 'Bungee', cursive;
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 255, 204, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 51, 102, 0.06) 0%, transparent 40%);
        }

        .header-logo {
            font-family: var(--font-heading);
            font-size: 36px;
            color: var(--color-accent);
            letter-spacing: 1px;
            text-decoration: none;
            display: flex;
            align-items: baseline;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            transition: transform 0.2s ease;
        }

        .header-logo:hover {
            transform: scale(1.05);
        }

        .header-logo .logo-v {
            font-size: 28px;
            margin: 0 1px;
        }

        .error-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 255, 204, 0.08);
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
        }

        .error-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--color-accent), var(--color-neon-pink));
        }

        .glitch-404 {
            font-family: var(--font-heading);
            font-size: 96px;
            line-height: 1;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--color-accent), #00c3ff, var(--color-neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 255, 204, 0.4));
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            from { filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.3)); }
            to { filter: drop-shadow(0 0 35px rgba(255, 51, 102, 0.6)); }
        }

        .error-status {
            font-family: var(--font-heading);
            font-size: 20px;
            letter-spacing: 2px;
            color: var(--color-neon-pink);
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .error-desc {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--color-accent), #00c3ff);
            color: #050515;
            font-family: var(--font-heading);
            font-size: 16px;
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .cta-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 35px rgba(0, 255, 204, 0.7);
        }

        .quick-links {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .quick-links-title {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
        }

        .game-chips {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 16px;
            transition: all 0.2s ease;
        }

        .game-chip:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            background: rgba(0, 255, 204, 0.06);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .error-card {
                padding: 35px 20px;
            }
            .glitch-404 {
                font-size: 72px;
            }
            .error-status {
                font-size: 16px;
            }
            .error-desc {
                font-size: 14px;
            }
            .cta-btn {
                padding: 14px 28px;
                font-size: 14px;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <a href="/" class="header-logo">S<span class="logo-v">v</span>K</a>

    <div class="error-card">
        <h1 class="glitch-404">404</h1>
        <div class="error-status">ZONE NOT FOUND</div>
        <p class="error-desc">
            The level or game page you requested doesn't exist or was relocated.
        </p>

        <a href="/" class="cta-btn">
            <span>🎮</span> BACK TO PORTAL
        </a>

        <div class="quick-links">
            <span class="quick-links-title">Or jump straight into:</span>
            <div class="game-chips">
                <a href="/?game=the-button" class="game-chip">🕹️ The Button</a>
                <a href="/?game=drop-off" class="game-chip">🔥 Drop-Off</a>
            </div>
        </div>
    </div>

</body>
</html>
