<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#0e0e2a"/>
      <stop offset="60%" stop-color="#060614"/>
      <stop offset="100%" stop-color="#03030b"/>
    </radialGradient>

    <linearGradient id="pinkBoltGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5588"/>
      <stop offset="45%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#cc0044"/>
    </linearGradient>

    <filter id="pinkGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyanTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00ffcc" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="502" height="502" x="5" y="5" rx="110" fill="none" stroke="#ff3366" stroke-width="4" stroke-opacity="0.3"/>

  <g filter="url(#pinkGlow)">
    <polygon points="290,30 465,90 295,220 440,220 115,480 250,295 85,295" fill="url(#pinkBoltGrad)"/>
  </g>

  <polygon points="310,60 435,105 310,210 395,210 155,440 240,290 125,290" fill="#ffffff" opacity="0.55"/>

  <g filter="url(#cyanTextGlow)">
    <text x="175" y="325" font-family="'Bungee', 'Impact', sans-serif" font-size="160" font-weight="900" fill="#00ffcc" stroke="#050512" stroke-width="22" paint-order="stroke fill" text-anchor="middle">S</text>
    <text x="256" y="325" font-family="'Bungee', 'Impact', sans-serif" font-size="115" font-weight="900" fill="#00ffcc" stroke="#050512" stroke-width="18" paint-order="stroke fill" text-anchor="middle">v</text>
    <text x="337" y="325" font-family="'Bungee', 'Impact', sans-serif" font-size="160" font-weight="900" fill="#00ffcc" stroke="#050512" stroke-width="22" paint-order="stroke fill" text-anchor="middle">K</text>
  </g>
</svg>
